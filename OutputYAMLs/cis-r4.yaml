element1:
  name: Cluster Name
  requirements: Ensure that the EKS cluster endpoint is private.  Configure the cluster
    endpoint to be a private IP address.  Ensure that the cluster endpoint is only
    accessible through the EKS control plane.
element10:
  name: EKS Custom Domains
  requirements: Configure the EKS cluster to use a custom domain.  Verify that the
    custom domain is properly associated with the EKS cluster and is accessible.  Check
    the EKS control plane configuration and domain assignment.
element11:
  name: EKS Service Quotas
  requirements: The EKS Service Quotas are a core security component that controls
    the resources available in your EKS cluster. Ensure the quotas are appropriately
    set up to prevent abuse.
element12:
  name: EKS EKS CLI
  requirements: The EKS CLI is used to manage your EKS cluster. Ensure it is installed
    and working correctly.  Verify that you have access to the EKS CLI.
element13:
  name: EKS Instance Types
  requirements: Ensure that the chosen EKS instance type is appropriate for your workload.
    Validate the instance type based on the expected resource usage.
element14:
  name: EKS EKS CLI
  requirements: The EKS CLI is used to manage your EKS cluster. Ensure it is installed
    and working correctly.  Verify that you have access to the EKS CLI.
element15:
  name: EKS Cluster Network Policy
  requirements: The cluster network policy should be configured correctly to allow
    all necessary network traffic between the cluster nodes. Verify the network policies
    are set correctly.
element2:
  name: Region Code
  requirements: The Region Code should be an AWS region that supports EKS.  Verify
    that the Region Code is valid and configured correctly within the EKS cluster.
element3:
  name: AWS EKS Describe-Cluster
  requirements: Check the AWS EKS Describe-Cluster command to ensure the EKS cluster
    has been created and its configuration is valid.  Verify the cluster endpoint
    is private, and the cluster is configured correctly.
element4:
  name: EKS Cluster Endpoint
  requirements: The EKS cluster endpoint must be configured as a private IP address.
    The EKS cluster endpoint must be configured to only allow access from the EKS
    control plane.
element5:
  name: EKS Service Quotas
  requirements: The EKS Service Quotas are a key resource for securing your cluster.
    Ensure that your quotas are appropriately set up, allowing you to prevent your
    cluster from exceeding the allocated resource limits.
element6:
  name: EKS Network Policies
  requirements: Network Policies should be applied to the EKS cluster to allow traffic
    between pods within the cluster.  Ensure that these Network Policies are properly
    configured.  Verify that the EKS control plane is configured for proper network
    access.
element7:
  name: EKS IAM Role
  requirements: The EKS cluster role should grant the necessary permissions to all
    users and applications within the cluster.  Ensure that the EKS cluster role has
    the required permissions to access the Kubernetes API server and other resources.
element8:
  name: EKS Cluster Endpoint Documentation
  requirements: Refer to the EKS Cluster Endpoint documentation for detailed information
    on how to configure the cluster endpoint correctly.  Verify the configuration
    of the cluster endpoint to ensure that it is correctly configured and allows access
    to the cluster.
element9:
  name: EKS EKS Networking Policy
  requirements: Enabling EKS Networking Policy is required to configure and enforce
    Network Policies. The policy should be configured to allow pods to communicate
    with each other.
