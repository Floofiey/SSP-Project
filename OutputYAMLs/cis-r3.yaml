element1:
  name: EncryptionConfig
  requirements:
  - 3.2.1 (Automated, L1) The CNI plugin must support network policies - confirm the
    deployed CNI (e.g., Calico, Cilium, or VPC CNI with network policy support) enforces
    NetworkPolicy resources.
  - 3.2.2 (Automated, L1) All Namespaces must have Network Policies defined - create
    default-deny ingress/egress NetworkPolicy objects in every namespace.
