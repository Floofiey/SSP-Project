  - 4.8 Uninstall or Disable Unnecessary Services on Enterprise Assets and Software
  - 4.8 Uninstall or Disable Unnecessary Services on Enterprise Assets and Software
element10:
  name: General Namespace Policies
  requirements:
  - 4.11 Ensure that the --make-iptables-util-chains argument is set to true (Automated)
    - Ensures the iptables configuration.
element11:
  name: General Namespace Policies
  requirements:
  - 4.12  Ensure that service account tokens are only mounted where necessary (Automated)
    - Prevents unauthorized service accounts.
element2:
  name: CNI Plugin and Network Policies
  requirements:
  - 4.3 (Manual, L1) The CNI plugin must support network policies - confirm the deployed
    CNI (e.g., Calico, Cilium, or VPC CNI with network policy support) enforces network
    policies resources.
  - 4.3 (Automated, L1) The Kubelet authentication argument is not set to AlwaysAllow
    (Automated).
  - 4.3 (Automated, L1) The --authorization-mode argument is not set to WebHook (Automated).
  - 4.3 (Automated, L1) A Client CA File is Configured (Automated).
  - 4.3 (Automated, L1) A Pod Security Standards (PSS) is Configured (Automated).
  - 4.3 (Automated, L1)  A Service Account is Configured (Automated).
element3:
  name: Secrets Management
  requirements:
  - 4.4 (Automated, L1) Secrets must be mounted as files rather than exposed as environment
    variables - use volume mounts with secretKeyRef, not env.valueFrom.
  - 4.4 (Manual, L2) Consider using an external secret store (e.g., AWS Secrets Manager,
    HashiCorp Vault) instead of native secrets for enhanced protection.
element4:
  name: General Namespace Policies
  requirements:
  - 4.5 (Manual, L1) Administrative boundaries must be created between resources using
    namespaces - group workloads by team, environment, or sensitivity level.
  - 4.5 (Automated, L2) The default namespace must not be used for workload deployment
    - all applications must reside in explicitly named namespaces.
element5:
  name: General Namespace Policies
  requirements:
  - 4.6 Ensure that the --read-only-port is disabled (Automated) -  prevents unauthorized
    access to the cluster.
  - 4.6 Ensure that the --read-only-port is disabled (Automated) - prevents unauthorized
    access to the cluster.
element6:
  name: General Namespace Policies
  requirements:
  - 4.7 Ensure that the --streaming-connection-idle-timeout is disabled (Automated)
    - prevents excessive events.
element7:
  name: General Namespace Policies
  requirements:
  - 4.8 Uninstall or Disable Unnecessary Services on Enterprise Assets and Software
element8:
  name: General Namespace Policies
  requirements:
  - 4.9  RotateKubeletServerCertificate Argument (Automated) - ensure proper certificate
    rotation for the API server.
element9:
  name: General Namespace Policies
  requirements:
  - 4.10 Ensure that the --eventRecordQPS argument is set to 0 or a level which ensures
    appropriate event capture (Automated) - Prevents excessive events.
