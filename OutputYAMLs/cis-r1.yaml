title: CIS Amazon Elastic Kubernetes Service (EKS) Benchmark v1.2.0 - 11-23-2022
element1:
  name: Kubernetes Security Configurations
  requirements:
  - Systemctl daemon-reload
  - systemctl restart kubelet
  - 'systemctl status kubelet -l Default Value: See the Amazon EKS documentation for
    the default value.'
  - kubectl proxy --port=8001 & export HOSTNAME_PORT=localhost:8001 export NODE_NAME=ip-192.168.31.226.ec2.internal
  - kubectl proxy --port=8001 & export HOSTNAME_PORT=localhost:8001 export NODE_NAME=ip-192.168.31.226.ec2.internal
  - kubectl get psp -o json
  - kubectl get psp <name> -o=jsonpath='{.spec.privileged}'
  - kubectl get psp -o=jsonpath='{.spec.hostPID}'
  - kubectl get psp -o=jsonpath='{.spec.hostIPC}'
  - kubectl get psp -o=jsonpath='{.spec.hostIPC}'
  - kubectl get psp -o=jsonpath='{.spec.hostPID}'
  - kubectl get psp -o=jsonpath='{.spec.hostIPC}'
  - kubectl get psp -o=jsonpath='{.spec.hostIPC}'
