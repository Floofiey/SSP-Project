element2:
  name: Pod Security Policies (PSPs)
  requirements:
  - Minimize admission of containers wishing to share the host process ID namespace
  - Restrict administrator privileges to dedicated administrator accounts
element3:
  name: Container Optimized OS
  requirements:
  - Use standard, industry-recommended hardening configuration templates for application
    infrastructure components.
element4:
  name: RBAC and Service Accounts
  requirements:
  - Ensure that the cluster-admin role is only used where required
  - Restrict administrator privileges to dedicated administrator accounts
element5:
  name: Pod Security Policies (PSPs)
  requirements:
  - Minimize the admission of containers wishing to share the host process ID namespace
  - Restrict administrator privileges to dedicated administrator accounts
element6:
  name: Secure Configuration Processes
  requirements:
  - Establish and maintain a secure configuration process for enterprise assets
element7:
  name: Container Image Security
  requirements:
  - Minimize the admission of containers wishing to share the host process ID namespace
element8:
  name: Kubernetes Control Panel
  requirements:
  - Minimize the admission of containers wishing to share the host process ID namespace
element9:
  name: Pod Security Policies
  requirements:
  - Minimize the admission of containers wishing to share the host process ID namespace
element1:
  name: AWS EKS Key Management Service
  requirements:
  - Utilize AWS EKS Key Management Service to manage secrets securely.
  - Implement a robust key rotation strategy.
  - Regularly review and update access policies.
  - Leverage AWS KMS for encryption and access control.
  - Utilize KMS-managed keys for enhanced security.
element10:
  name: ECR Registry
  requirements:
  - Only use ECR registry.
  - Utilize ECR security policies.
element2:
  name: IAM Roles for Service Accounts
  requirements:
  - Use IAM roles to grant permissions to Kubernetes services.
  - Associate IAM roles with service accounts.
  - Restrict role bindings to the minimum necessary permissions.
  - Securely manage service account credentials.
element3:
  name: AWS KMS
  requirements:
  - Utilize AWS KMS for encryption and access control.
  - Manage encryption keys using KMS.
  - Implement key rotation for KMS keys.
element4:
  name: PodSecurityPolicies
  requirements:
  - Configure PodSecurityPolicies to restrict container privileges.
  - Enable the default PodSecurityPolicy.
  - Restrict containers access to other resources.
element5:
  name: Network Policies
  requirements:
  - Implement network policies to control communication between pods.
  - Follow network policy best practices.
  - Implement security best practices in network policies.
element6:
  name: Least Privilege Principle
  requirements:
  - Apply least privilege principle.
  - Restrict service account permissions.
element7:
  name: IAM Roles
  requirements:
  - Use IAM roles to manage permissions for Kubernetes workers.
  - Properly configure roles for service accounts.
element8:
  name: Automated Patch Management
  requirements:
  - Implement and maintain automated patching processes.
  - Automated patching to ensure systems are up-to-date.
element9:
  name: Container Image Scanning
  requirements:
  - Implement comprehensive container image scanning protocols.
  - Implement image scanning to identify vulnerabilities.
  - Implement image scanning to ensure that images are compliant with security standards.
