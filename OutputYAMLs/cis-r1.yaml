element1:
  name: CIS Amazon Elastic Kubernetes Service (EKS) Benchmark v1.2.0
  requirements:
  - '3.2.1 (Automated, L1) Anonymous authentication must be disabled - set authentication.anonymous.enabled:
    false in the kubelet config file or pass'
  - 3.2.2 (Automated, L1) --authorization-mode must not be set to AlwaysAllow - verify
    the argument is absent or set to a restrictive mode (e.g., Webhook).
  - 3.2.3 (Automated, L1) A Client CA File must be Configured - ensure --client-ca-file
    is set to a valid CA bundle in the kubelet config.
  - 3.2.4 (Automated, L1) --read-only-port must be disabled (set to 0) to prevent
    unauthenticated access to the kubelet metrics.
  - 3.2.5 (Automated, L1) --streaming-connection-idle-timeout must not be 0 - a non-zero
    timeout prevents indefinitely open streaming connections.
  - 3.2.6 (Automated, L1) --make-iptables-util-chains must be set to true to ensure
    kubelet manages iptable rules correctly.
  - 3.2.7 (Automated, L1) --eventRecordQPS must be set to 0 or an appropriate value
    that ensures adequate event capture without overloading the API server.
  - 3.2.8 (Automated, L1) --rotate-certificates must not be present or must be set
    to true to enable automatic client certificate rotation.
  - 3.2.9 (Automated, L1) RotateKubeletServerCertificate must be set to true to enable
    automatic server certificate rotation.
  - 3.3 Container Optimized OS
element10:
  name: CNI Plugin and Network Policies
  requirements:
  - 6.1 - Ensure that the CNI plugin is set up to allow the application to be accessed
  - 6.2 - Ensure that all network policies are set up and not overridden
element11:
  name: Secrets Management
  requirements:
  - 7.1 -  Verify that secrets have been configured as files
  - 7.2 - The --secret-key is set.
element12:
  name: General Namespace Policies
  requirements:
  - 8.1 - Check the namespace configuration against the defined policies.
element13:
  name: General Policies
  requirements:
  - 9.1 -  Verify the security settings in the control plane.
element14:
  name: Manage Kubernetes Service
  requirements:
  - 10.1 -  Perform all of the required steps to verify the service and its configuration
    is correct.
element15:
  name: Kubernetes Service Configuration
  requirements:
  - 11.1 -  Log the services, including the ability to verify the logs
element16:
  name: Security Management
  requirements:
  - 12.1 -  Verify that the Kubelet service is running
element2:
  name: CNI Plugin and Network Policies
  requirements:
  - 4.3.1 (Manual, L1) The CNI plugin must support network policies - confirm the
    deployed CNI (e.g., Calico, Cilium, or VPC CNI with network policy support) enforces
    network policies.
  - 4.3.2 (Automated, L1) All Namespaces must have Network Policies defined - create
    default-deny ingress/egress NetworkPolicy objects in every namespace.
element3:
  name: Secrets Management
  requirements:
  - 3.3.1 Secrets must be mounted as files rather than as environment variables -
    use volume mounts with secretKeyRef, not env.valueFrom.
  - 3.3.2 Secrets must be configured as files - The `--secret-config` argument and
    --secret-value must be set.
  - 3.3.3 Ensure that a Client CA File is Configured - Confirm that a client CA file
    exists to allow clients to verify that the secrets are coming from a trusted source.
  - 3.3.4 Ensure that a Secret key is configured - the secret key must be set to a
    specific value.
  - 3.3.5 Ensure that the --secret-value must be set to a specific value.
element4:
  name: General Namespace Policies
  requirements:
  - 4.4.1 (Manual, L1) Administrative boundaries must be created between resources
    using namespaces - group workloads by team, environment, or sensitivity level.
  - 4.4.2 (Manual, L2) Pod Security Policies - Minimize the access to the service
    account via security groups.
element5:
  name: Managed Services
  requirements:
  - 5.1 - Establish Secure Configurations - Ensure that security configurations are
    done as a part of the established security goals and needs.
  - 5.2 - Maintain Secure Configurations - Maintain secure configurations and ensure
    that it is not possible for the service to be compromised.
  - 5.3 - Ensure Only Approved Ports, Protocols and Services Are Running - ensure
    that only network ports, protocols and services listening on a system with validated
    business needs.
element6:
  name: General Policies
  requirements:
  - 5.4 -  Ensure that the service is configured based on the correct environment.
    As this configuration may not be applicable to all environment or users.  Ensure
    it is possible to verify the configuration. It may be possible to verify the configuration
    with the current environment.
element7:
  name: Configuration of Active Kubernetes Service
  requirements:
  - 5.5 -  The Kubernetes Service Must Be Configured for all active services and not
    have any configuration at all.
element8:
  name: Security Management
  requirements:
  - 5.6 -  Automated Configuration Methods
  - 5.7 - Manual Configuration Methods
  - 5.8 - Ensure that no configuration methods are being used in the current environment.
element9:
  name: Kubelet Security Configuration
  requirements:
  - 5.9 - Ensure all the Kubelet service is running
  - 5.10 - Ensure the Kubelet has no security vulnerabilities
