  control_name: Version Control IG 1 IG 2 IG 3 v8
  description: Restrict Administrator Privileges to Dedicated Administrator Accounts
  impact: 'If configuring via the Kubelet config file, you first need to locate the
    Kubelet process, from which we can see the location of the configuration file
    provided to the kubelet service with the --config argument. The file can be viewed
    with a command such as more or less, like so:  sudo less /path/to/kubelet-config.json'
