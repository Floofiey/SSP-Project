General:
- Description: Use technical controls, such as application allowlisting, to ensure
    that only authorized software can execute or be accessed.
  Rationale: Limits unauthorized access to internal applications and services.
- Description: Perform authenticated vulnerability scanning with agents running locally
    on each system.
  Rationale: Provides robust security assessment.
